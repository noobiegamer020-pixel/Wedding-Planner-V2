name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Web files
        run: |
          mkdir -p www && cp index.html firebase-config.js www/
          mkdir -p www/fonts && cp node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2 www/fonts/nunito.woff2 || echo "Using the system font"
          cp node_modules/firebase/firebase-app-compat.js node_modules/firebase/firebase-firestore-compat.js www/ || echo "Using the online copy of Firebase"

      - name: Android project and icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Storage permissions for backups
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>#' $M
      - name: Navigation bar colours
        run: |
          R=android/app/src/main/res
          mkdir -p $R/values-night
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="navBar">#FFFFFF</color><bool name="lightNav">true</bool></resources>' > $R/values/navbar.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="navBar">#251434</color><bool name="lightNav">false</bool></resources>' > $R/values-night/navbar.xml
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item><item name="android:navigationBarColor">@color/navBar</item><item name="android:windowLightNavigationBar">@bool/lightNav</item>#' $R/values/styles.xml
      - name: Same signing key every build
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Wedding-Planner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
